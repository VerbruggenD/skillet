[project]
name = "skillet-backend"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic-settings",
    "fastapi-users[sqlalchemy]",
    "asyncpg",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "pyright>=1.1.397",
    "httpx2>=0.28.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D203", "D212", "D213"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
reportMissingImports = "none"
include = ["app"]

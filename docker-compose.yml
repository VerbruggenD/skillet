version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillet-api
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      - postgres

  # Run the frontend separately with `cd frontend && npm run dev` for live updates.
  # Set NEXT_PUBLIC_API_URL=http://localhost:${APP_PORT:-8000} in the frontend dev environment.
  # web:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: skillet-web
  #   ports:
  #     - "${WEB_PORT:-3000}:3000"
  #   env_file:
  #     - .env
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://api:8000
  #   depends_on:
  #     - api

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillet}
      POSTGRES_DB: ${POSTGRES_DB:-skillet}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # One-off container used to run migrations inside the compose network
  migrator:
    image: python:3.13-slim
    working_dir: /work
    volumes:
      - ./backend:/work
    entrypoint: ["sleep", "infinity"]
    depends_on:
      - postgres

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillet-api
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      - postgres

  # Frontend (Next.js). Opt-in via the `web` profile so the default
  # `docker compose up -d` remains the api + postgres dev stack.
  # For self-hosting: docker compose --profile web up -d --build
  web:
    profiles: ["web"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time. For the recommended
        # single-origin topology this is the public site origin
        # (e.g. https://skillet.example.com); its /api path is reverse-proxied
        # to the API container.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL (the public site origin) in .env}
    container_name: skillet-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - api

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillet}
      POSTGRES_DB: ${POSTGRES_DB:-skillet}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # One-off container used to run migrations inside the compose network
  migrator:
    image: python:3.13-slim
    working_dir: /work
    volumes:
      - ./backend:/work
    entrypoint: ["sleep", "infinity"]
    depends_on:
      - postgres

name: Verify DB migrations

on:
  push:
  pull_request:

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillet
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: skillet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic sqlalchemy psycopg[binary]
      - name: Wait for Postgres
        env:
          DATABASE_URL: postgresql://skillet:change-me@localhost:5432/skillet
        run: |
          python - <<'PY'
import time, os, sys
import psycopg
url = os.environ['DATABASE_URL']
for i in range(30):
    try:
        conn = psycopg.connect(url)
        conn.close()
        print('Postgres ready')
        sys.exit(0)
    except Exception as e:
        print('waiting for postgres...', e)
        time.sleep(1)
print('Postgres not ready')
sys.exit(1)
PY
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://skillet:change-me@localhost:5432/skillet
        run: |
          alembic -c backend/migrations/alembic.ini upgrade head
